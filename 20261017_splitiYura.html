        content: "";
    }

        clear: both;
        content: "";
    }

        padding: 0;
        margin: 16px 0;
        background-color: #e7e7e7;
        border: 0 none;
    }

    }

    }

    }

    a {
        background-color: transparent;
    }

    a:active,

        outline: 0;
    }

        display: none;
    }

    .no-print {
        display: block;
    }

    .nowrap {
        white-space: nowrap;
    }

    .text-center {
        text-align: center;
    }

        margin: 0;

    }

        }

        }

<body>
    <div id="content">
<div class="text-center">
    <h3>                 <br>17.10.2026 Batanik Garden</h3>
    <h2>SPLIT GRID</h2>
</div>
<div class="scheme-switcher" id="scheme-switcher">
    <span class="scheme-switcher-label">Color scheme:</span>
    <button type="button" class="scheme-btn" data-scheme="1">1 · Classic</button>
    <button type="button" class="scheme-btn" data-scheme="2">2 · Grey &amp; Yellow</button>
    <button type="button" class="scheme-btn" data-scheme="3">3 · Modern</button>
</div>
<div id="results-tables"></div>

<style>
    table.table-split {
        margin: 0;
    }

    table.table-split td {
        border: 0;
        padding: 0;
    }

    /* Rank-1 leg/cumulative-time cells in red, rank-2/3 in blue — same
       palette as the classic OE-style split report this template mirrors.
       Overrides style.css.html's shared .result-1/2/3 (bold-only) by
       source order, scoped to this template only. */
    .result-1 {
        color: #FF0000;
    }

    .result-2,
    .result-3 {
        color: #0000FF;
    }

    /* Bottom line of a merged cell (organization under name, diff under
       result) — smaller and muted so the top line still reads first. */
    .result-sub {
        font-size: 85%;
        color: #666666;
    }

    /* A control nobody punched (buildSplitCells) — muted, not a rank color,
       so it never reads as a 1st/2nd/3rd cell. */
    .split-mp {
        color: #666666;
        font-weight: 700;
        font-size: 90%;
        text-align: center;
    }

    /* A control recovered from raw punch data after a mispunch — real time,
       but unranked (may silently span a skipped leg), so it's italicized
       and left uncolored rather than getting a rank color it didn't earn. */
    .split-recovered {
        color: #666666;
        font-style: italic;
    }

    /* ── COLOR SCHEMES ────────────────────────────────────────────────
       Scheme 1 (default, no attribute): the styling above, unchanged.
       Scheme 2: grey header/data/footer + pale-yellow time cells, same
       palette as the classic OE-style report this whole template started
       from — the two yellows there (#FFFFD0 / #FFFF80) turned out to mark
       regular rows vs. the closing/bottom-bordered row, which maps neatly
       onto our own Best-time row. Scheme 3: a validated light palette
       (dataviz skill's reference palette — same source as the chart's own
       --series-N colors) with gold/blue "podium" tiers instead of raw
       red/blue, so the fastest cell reads as an achievement highlight
       rather than borrowing red's usual "danger" meaning. */

    .scheme-switcher {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 0.8rem;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    .scheme-switcher-label {
        font-size: 0.8rem;
        color: #52514e;
    }

    .scheme-btn {
        padding: 0.3rem 0.7rem;
        border: 1.5px solid #c8d8e4;
        border-radius: 6px;
        background: #fff;
        color: #222;
        font-size: 0.8rem;
        cursor: pointer;
    }

    .scheme-btn:hover {
        background: #f2f8fa;
    }

    .scheme-btn.is-active {
        border-color: #2a78d6;
        background: #2a78d6;
        color: #fff;
        font-weight: 600;
    }

    /* Scheme 2 — grey & yellow */

    body[data-color-scheme="2"] {
        background: #E0E0E0;
    }

    body[data-color-scheme="2"] #footer {
        background: #E0E0E0;
        color: #000000;
    }

    body[data-color-scheme="2"] table.sportorg-table th {
        background: #E0E0E0;
        color: #000000;
        border-bottom: 1px solid #808080;
    }

    body[data-color-scheme="2"] table.sportorg-table td {
        background: #E0E0E0;
        color: #000000;
    }

    body[data-color-scheme="2"] .result-sub {
        color: #4d4d4d;
    }

    body[data-color-scheme="2"] .split-mp,
    body[data-color-scheme="2"] .split-recovered {
        color: #4d4d4d;
    }

    body[data-color-scheme="2"] .table-split td {
        background: #FFFFD0;
    }

    body[data-color-scheme="2"] .table-split td.best-time-cell {
        background: #FFFF80;
    }

    body[data-color-scheme="2"] .result-1 {
        color: #FF0000;
    }

    body[data-color-scheme="2"] .result-2,
    body[data-color-scheme="2"] .result-3 {
        color: #0000FF;
    }

    /* Scheme 3 — validated light palette, gold/blue podium tiers */

    body[data-color-scheme="3"] {
        background: #f9f9f7;
        color: #0b0b0b;
    }

    body[data-color-scheme="3"] #footer {
        background: #efeee9;
        border-top: 1px solid #e1e0d9;
    }

    body[data-color-scheme="3"] table.sportorg-table th {
        background: #efeee9;
        color: #0b0b0b;
        border-bottom: 1px solid #c3c2b7;
    }

    .split-chart-btn-row {

        background: #fff;
        cursor: pointer;

    .split-chart-toggle-btn:hover {
        background: #2a78d6;
        color: #fff;

        cursor: pointer;
    }

    .split-chart-check-wrap {
        display: inline-flex;
        align-items: center;
        gap: 4px;

        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.25);

    .split-chart-axis-label {

    .split-chart-crosshair {

    .split-chart-colhit {

    .split-chart-colhit .split-chart-axis-label {

    .split-chart-colhit:hover .split-chart-axis-label,

    .split-chart-line-group {

    .split-chart-line {

        stroke-linecap: round;

    .split-chart-line-hit {
        stroke: transparent;
        stroke-width: 7;
        fill: none;
        pointer-events: stroke;
    }

    .split-chart-dot {
        fill: var(--chart-muted);
        stroke: #fff;
        stroke-width: 1;

    .split-chart-line-group.is-highlighted .split-chart-line {
        stroke: var(--line-color, var(--chart-accent));
        stroke-width: 1.5;
    }

    .split-chart-line-group.is-highlighted .split-chart-dot {
        fill: var(--line-color, var(--chart-accent));
    }

    .split-chart-line-group.is-highlighted:hover .split-chart-line {
        stroke-width: 2;

    .split-chart-line-group.is-highlighted.is-incomplete .split-chart-dot {

        stroke: var(--line-color, var(--chart-accent));

    .split-chart-end-label.is-incomplete {

    .split-chart-leader {

    .split-chart-end-label {

    .split-chart-standing-rank {

    .split-chart-standing-swatch {

    .split-chart-standing-bib {

        // Name+organization and result+diff each collapse into one cell,
        // top line primary / bottom line secondary — same visual language
        // as the leg-time/cumulative-time split cells below.
        function twoLineCell(top, bottom) {
            var table = document.createElement('table');
            table.className = 'table-split';
            var trTop = document.createElement('tr');
            var tdTop = document.createElement('td');
            tdTop.appendChild(document.createTextNode(top));
            trTop.appendChild(tdTop);
            table.appendChild(trTop);
            var trBottom = document.createElement('tr');
            var tdBottom = document.createElement('td');
            tdBottom.className = 'result-sub';
            tdBottom.appendChild(document.createTextNode(bottom));
            trBottom.appendChild(tdBottom);
            table.appendChild(trBottom);
            return table;
        }

        // Unranked/uncolored version of rankedTrBlock, for the "Best time" row
        // — bold throughout, same as the "Best time" label itself.
        function plainTrBlock(t) {
            var tr = document.createElement('tr');
            var td = document.createElement('td');
            td.className = 'best-time-cell'; // scheme-2/3 hook — see the color-scheme CSS block
            var b = document.createElement('b');
            b.appendChild(document.createTextNode(t));
            td.appendChild(b);
            tr.appendChild(td);
            return tr;
        }

        // Rank-colored row (the shared shape behind every leg/cumulative/finish
        // cell) — td gets class result-<p>, colored red/blue for p 1 / 2-3 by
        // this template's own <style> block.
        function rankedTrBlock(t, p) {
            var tr = document.createElement('tr');
            var td = document.createElement('td');
            td.className = 'result-' + p;
            td.appendChild(document.createTextNode(t));
            tr.appendChild(td);
            return tr;
        }

            if (location.href.indexOf('s_splits=0') > -1) store.splitsShow = false;
            store.rankingShow = location.href.indexOf('ranking=1') > -1;
            store.showProtocolByCourse = location.href.indexOf('by_course=1') > -1;
        } catch (e) { }

        function render() {
            var resultBlock = document.getElementById('results-tables');
            resultBlock.innerHTML = '';
            Fields.active('group', store.showProtocolByCourse);
            if (store.showProtocolByCourse) {
                var _a = race.courses;
            } else {
                var _a = race.groups;
            }
            for (var _i = 0; _i < _a.length; _i++) {
                if (store.showProtocolByCourse) {
                    var course = _a[_i];
                    var rows = getResultsByCourse(course, store.count);
                    var groupName = course.name;
                } else {
                    var group = _a[_i];
                    var rows = getResultsByGroup(group, store.count);
                    var course = group.course;
                    var groupName = group.name;
                }
                if (!rows.length) {
                    continue;
                }
                var chartKey = (store.showProtocolByCourse ? 'c:' : 'g:') + groupName;
                var titleBlock = document.createElement('h2');
                titleBlock.id = groupName;
                var groupTitle = groupName;
                if (course && course.controls && course.controls.length) {
                    groupTitle += ', ' + course.controls.length + ' controls';
                }
                if (course && course.length) {
                    groupTitle += ', ' + course.length / 1000 + ' km';
                }
                titleBlock.appendChild(document.createTextNode(groupTitle));
                resultBlock.appendChild(titleBlock);
                if (!store.showProtocolByCourse && store.showLinkForGroups) {
                    resultBlock.appendChild(getGroupsBlockElement(race));
                }
                var fields = Fields.getCopyFields();
                if (store.splitsShow && course && course.controls && course.controls.length) {
                    resultBlock.appendChild(buildChartSection(chartKey, course, rows));
                    fields.unshift({ key: 'chart_check', title: '' });
                    rows.forEach(function (row) {
                        // Any real competitor row can go on the chart, not just
                        // finishers — a mispunched/DSQ/DNF runner's valid splits
                        // up to where they stopped are still worth comparing.
                        if (row.data) {
                            row.chart_check = buildChartCheckbox(chartKey, String(row.data.person.bib));
                        }
                    });
                    course.controls.forEach(function (control, index) {
                        fields.push({ key: index + '_' + control.code, title: control.code })
                    });
                    fields.push({ key: 'finish_split', title: 'F' })
                }
                if (!store.tableView && !store.splitsShow && !Fields.isActive('all_splits')) {
                    resultBlock.appendChild(new TableTextGenerator(rows, fields).getTable());
                } else {
                    resultBlock.appendChild(new TableGenerator(rows, fields).getTable({ className: 'sportorg-table' }));
                }
                //show ranking information
                if (!store.showProtocolByCourse && store.rankingShow) {
                    resultBlock.appendChild(getRankingByGroup(group))
                }
                if (store.newPage && _i < _a.length - 1) {
                    var newPage = document.createElement('div');
                    newPage.className = 'new-page';
                    resultBlock.appendChild(newPage);
                }
            }
            var query = {
                s_splits: store.splitsShow ? 1 : 0,
                ranking: store.rankingShow ? 1 : 0,
                by_course: store.showProtocolByCourse ? 1 : 0,
                all_splits: Fields.isActive('all_splits') ? 1 : 0,
                scores: Fields.isActive('scores') ? 1 : 0,
                penalty_time: Fields.isActive('penalty_time') ? 1 : 0
            };
            var queryString = '?';
            Object.keys(query).forEach(function (key) {
                if (query[key]) {
                    queryString += key + '=' + query[key] + '&';
                }
            });
            queryString += 'sportorg=1';
            try {
                var href = location.href.split('?')[0];
                history.pushState({}, null, href + queryString);
            } catch (e) { }
        }

        // Color scheme — applied to <body> so every scheme-2/3 CSS rule
        // above (scoped as body[data-color-scheme="N"] ...) can target it;
        // remembered per-browser so reopening the same exported file keeps
        // your last pick (best-effort — file:// storage isn't guaranteed
        // by every browser, hence the try/catch).
        function applyColorScheme(n) {
            document.body.dataset.colorScheme = String(n);
            document.querySelectorAll('.scheme-btn').forEach(function (btn) {
                btn.classList.toggle('is-active', btn.dataset.scheme === String(n));
            });
            try { localStorage.setItem('sportorg_split_scheme', String(n)); } catch (e) { }
        }

        var savedScheme = '1';
        try { savedScheme = localStorage.getItem('sportorg_split_scheme') || '1'; } catch (e) { }
        applyColorScheme(savedScheme);

        document.querySelectorAll('.scheme-btn').forEach(function (btn) {
            btn.addEventListener('click', function () { applyColorScheme(btn.dataset.scheme); });
        });

        // Chart interactions — bound once on the (stable) results container
        // rather than re-bound per render(), since render() throws away and
        // rebuilds every element inside it on every call.
        var resultsContainer = document.getElementById('results-tables');
        resultsContainer.addEventListener('change', function (e) {
            if (e.target.classList.contains('split-chart-check')) {
                onToggleChartHighlight(e.target.dataset.key, e.target.dataset.bib);
            }
        });
        resultsContainer.addEventListener('click', function (e) {
            var toggleBtn = e.target.closest('.split-chart-toggle-btn');
            if (toggleBtn) { onToggleChartOpen(toggleBtn.dataset.key); return; }
            var lineGroup = e.target.closest('.split-chart-line-group');
            if (lineGroup) { onToggleChartHighlight(lineGroup.dataset.key, lineGroup.dataset.bib); return; }
            var colHit = e.target.closest('.split-chart-colhit');
            if (colHit) { onSelectChartColumn(colHit.dataset.key, colHit.dataset.cp); return; }
            var clearBtn = e.target.closest('.split-chart-clear');
            if (clearBtn) { onClearChartHighlights(clearBtn.dataset.key); return; }
        });

        render();

        var Scrolling = {
            direction: 1,
            enabled: false,
            lock: false,
            prev: 0,
            intervalTimer: 0,
            init: function () {
                var _this = this;
                if (_this.intervalTimer) {
                    clearInterval(_this.intervalTimer)
                }
                _this.intervalTimer = setInterval(function () {
                    _this.lock = !_this.lock;
                }, 5000);
                window.onscroll = function () {
                    var d = document.documentElement;
                    var offset = d.scrollTop + window.innerHeight;
                    var height = d.offsetHeight;

                    if (offset === height) {
                        _this.direction = -1;
                    }
                    if (offset <= window.innerHeight) {
                        _this.direction = 1;
                    }
                };
                this.pageScroll();
                return this;
            },
            pageScroll: function () {
                var _this = this;
                if (_this.enabled && !_this.lock) {
                    window.scrollBy(10, _this.direction);
                }
                setTimeout(function () {
                    _this.pageScroll();
                }, 10);
            }
        }.init();

        new SettingsGenerator([
            {
                title: 'Classes links',
                value: !!store.showLinkForGroups,
                change: function (checked) {
                    store.showLinkForGroups = checked;
                    render()
                }
            },
            {
                title: 'Results by courses',
                value: !!store.showProtocolByCourse,
                change: function (checked) {
                    store.showProtocolByCourse = checked;
                    render()
                }
            },
            {
                title: 'Table view',
                value: !!store.tableView,
                change: function (checked) {
                    store.tableView = checked;
                    render()
                }
            },
            {
                title: 'Bib',
                value: Fields.isActive('bib'),
                change: function (checked) {
                    Fields.active('bib', checked);
                    render()
                }
            },
            {
                title: 'Penalty time',
                value: Fields.isActive('penalty_time'),
                change: function (checked) {
                    Fields.active('penalty_time', checked);
                    render()
                }
            },
            {
                title: 'Penalty laps',
                value: Fields.isActive('penalty_laps'),
                change: function (checked) {
                    Fields.active('penalty_laps', checked);
                    render()
                }
            },
            {
                title: 'Pace',
                value: Fields.isActive('speed'),
                change: function (checked) {
                    Fields.active('speed', checked);
                    render()
                }
            },
            {
                title: 'Splits (no forking)',
                value: !!store.splitsShow,
                change: function (checked) {
                    store.splitsShow = checked;
                    render()
                }
            },
            {
                title: 'Splits (all)',
                value: Fields.isActive('all_splits'),
                change: function (checked) {
                    Fields.active('all_splits', checked);
                    render()
                }
            },
            {
                title: 'Scores',
                value: Fields.isActive('scores'),
                change: function (checked) {
                    Fields.active('scores', checked);
                    render()
                }
            },
            {
                title: 'Ranking (Russian)',
                value: store.rankingShow,
                change: function (checked) {
                    store.rankingShow = checked;
                    render()
                }
            },
            {
                title: 'Show first: ',
                value: [
                    { text: 'All', value: 0 },
                    { text: '1', value: 1 },
                    { text: '3', value: 3 },
                    { text: '4', value: 4 },
                    { text: '5', value: 5 },
                    { text: '6', value: 6 },
                    { text: '10', value: 10 }
                ],
                change: function (arr) {
                    store.count = arr[0];
                    render();
                }
            },
            {
                title: 'Each class from new page',
                value: false,
                change: function (checked) {
                    store.newPage = checked;
                    render()
                }
            },
            {
                title: 'Autoscroll',
                value: Scrolling.enabled,
                change: function (checked) {
                    Scrolling.enabled = checked;
                }
            },
        ]).show();
    })();
</script>

</div>

        <a href="https://sportorg.readthedocs.io">Software SportOrg v1.7.2</a>
        <script type="text/javascript">
            var l = new Date();
            document.write('<span class="print-only">Print time: ' + l.toLocaleString() + '</span>');
        </script>
        
    </div>
