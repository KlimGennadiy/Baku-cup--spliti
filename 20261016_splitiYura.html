    }

        content: "";
    }

        background-color: transparent;
    }

    a:active,

        outline: 0;
    }

    }

    .no-print {
        display: block;
    }

    .nowrap {
        white-space: nowrap;
    }

    .text-center {
        text-align: center;
    }

        }

<body>
    <div id="content">
<div class="text-center">
    <h3>           <br>16.10.2026 Galaalti</h3>
    <h2>SPLIT GRID</h2>
</div>
<div class="scheme-switcher" id="scheme-switcher">
    <span class="scheme-switcher-label">Color scheme:</span>
    <button type="button" class="scheme-btn" data-scheme="1">1 · Classic</button>
    <button type="button" class="scheme-btn" data-scheme="2">2 · Grey &amp; Yellow</button>
    <button type="button" class="scheme-btn" data-scheme="3">3 · Modern</button>
</div>
<div id="results-tables"></div>

<style>
    table.table-split {
        margin: 0;
    }

    table.table-split td {
        border: 0;
        padding: 0;
    }

    /* Rank-1 leg/cumulative-time cells in red, rank-2/3 in blue — same
       palette as the classic OE-style split report this template mirrors.
       Overrides style.css.html's shared .result-1/2/3 (bold-only) by
       source order, scoped to this template only. */
    .result-1 {
        color: #FF0000;
    }

    .result-2,
    .result-3 {
        color: #0000FF;
    }

    /* Bottom line of a merged cell (organization under name, diff under
       result) — smaller and muted so the top line still reads first. */
    .result-sub {
        font-size: 85%;
        color: #666666;
    }

    /* A control nobody punched (buildSplitCells) — muted, not a rank color,
       so it never reads as a 1st/2nd/3rd cell. */
    .split-mp {
        color: #666666;
        font-weight: 700;
        font-size: 90%;
        text-align: center;
    }

    /* A control recovered from raw punch data after a mispunch — real time,
       but unranked (may silently span a skipped leg), so it's italicized
       and left uncolored rather than getting a rank color it didn't earn. */
    .split-recovered {
        color: #666666;
        font-style: italic;
    }

    /* ── COLOR SCHEMES ────────────────────────────────────────────────
       Scheme 1 (default, no attribute): the styling above, unchanged.
       Scheme 2: grey header/data/footer + pale-yellow time cells, same
       palette as the classic OE-style report this whole template started
       from — the two yellows there (#FFFFD0 / #FFFF80) turned out to mark
       regular rows vs. the closing/bottom-bordered row, which maps neatly
       onto our own Best-time row. Scheme 3: a validated light palette
       (dataviz skill's reference palette — same source as the chart's own
       --series-N colors) with gold/blue "podium" tiers instead of raw
       red/blue, so the fastest cell reads as an achievement highlight
       rather than borrowing red's usual "danger" meaning. */

    .scheme-switcher {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 0.8rem;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    .scheme-switcher-label {
        font-size: 0.8rem;
        color: #52514e;
    }

    .scheme-btn {
        padding: 0.3rem 0.7rem;
        border: 1.5px solid #c8d8e4;
        border-radius: 6px;
        background: #fff;
        color: #222;
        font-size: 0.8rem;
        cursor: pointer;
    }

    .scheme-btn:hover {
        background: #f2f8fa;
    }

    .scheme-btn.is-active {
        border-color: #2a78d6;
        background: #2a78d6;
        color: #fff;
        font-weight: 600;
    }

    /* Scheme 2 — grey & yellow */

    body[data-color-scheme="2"] {
        background: #E0E0E0;
    }

    body[data-color-scheme="2"] #footer {
        background: #E0E0E0;
        color: #000000;
    }

    body[data-color-scheme="2"] table.sportorg-table th {
        background: #E0E0E0;
        color: #000000;
        border-bottom: 1px solid #808080;
    }

    body[data-color-scheme="2"] table.sportorg-table td {
        background: #E0E0E0;
        color: #000000;
    }

    body[data-color-scheme="2"] .result-sub {
        color: #4d4d4d;
    }

    body[data-color-scheme="2"] .split-mp,
    body[data-color-scheme="2"] .split-recovered {
        color: #4d4d4d;
    }

    body[data-color-scheme="2"] .table-split td {
        background: #FFFFD0;
    }

    body[data-color-scheme="2"] .table-split td.best-time-cell {
        background: #FFFF80;
    }

    body[data-color-scheme="2"] .result-1 {
        color: #FF0000;
    }

    body[data-color-scheme="2"] .result-2,
    body[data-color-scheme="2"] .result-3 {
        color: #0000FF;
    }

    /* Scheme 3 — validated light palette, gold/blue podium tiers */

    body[data-color-scheme="3"] {
        background: #f9f9f7;
        color: #0b0b0b;
    }

    body[data-color-scheme="3"] #footer {
        background: #efeee9;
        border-top: 1px solid #e1e0d9;
    }

    body[data-color-scheme="3"] table.sportorg-table th {
        background: #efeee9;
        color: #0b0b0b;
        border-bottom: 1px solid #c3c2b7;
    }

    .split-chart-toggle-btn:hover {

    .split-chart-check-wrap {
        display: inline-flex;
        align-items: center;

    .split-chart-colhit .split-chart-axis-label {

    .split-chart-colhit:hover .split-chart-axis-label,

    .split-chart-line-hit {

    .split-chart-dot {

    .split-chart-line-group.is-highlighted .split-chart-line {

    .split-chart-line-group.is-highlighted .split-chart-dot {

    .split-chart-end-label.is-incomplete {

        var selected = {"persons": []} ;

        var race = JSON.parse(await gunzipBase64(race));

        var isRogaine = race.settings.result_processing_mode === 'scores';

        // Name+organization and result+diff each collapse into one cell,
        // top line primary / bottom line secondary — same visual language
        // as the leg-time/cumulative-time split cells below.
        function twoLineCell(top, bottom) {
            var table = document.createElement('table');
            table.className = 'table-split';
            var trTop = document.createElement('tr');
            var tdTop = document.createElement('td');
            tdTop.appendChild(document.createTextNode(top));
            trTop.appendChild(tdTop);
            table.appendChild(trTop);

            var tdBottom = document.createElement('td');
            tdBottom.className = 'result-sub';
            tdBottom.appendChild(document.createTextNode(bottom));
            trBottom.appendChild(tdBottom);

        }

        // Unranked/uncolored version of rankedTrBlock, for the "Best time" row
        // — bold throughout, same as the "Best time" label itself.
        function plainTrBlock(t) {
            var tr = document.createElement('tr');
            var td = document.createElement('td');
            td.className = 'best-time-cell'; // scheme-2/3 hook — see the color-scheme CSS block
            var b = document.createElement('b');
            b.appendChild(document.createTextNode(t));
            td.appendChild(b);
            tr.appendChild(td);
            return tr;
        }

        // Rank-colored row (the shared shape behind every leg/cumulative/finish
        // cell) — td gets class result-<p>, colored red/blue for p 1 / 2-3 by
        // this template's own <style> block.
        function rankedTrBlock(t, p) {
            var tr = document.createElement('tr');
            var td = document.createElement('td');
            td.className = 'result-' + p;
            td.appendChild(document.createTextNode(t));
            tr.appendChild(td);
            return tr;
        }

        // A control nobody punched at all — no time to show.
        function mpCell() {
            var tbl = document.createElement('table');
            tbl.className = 'table-split';
            var tr = document.createElement('tr');
            var td = document.createElement('td');
            td.className = 'split-mp';
            td.title = 'Missing punch — this control was not recorded.';
            td.appendChild(document.createTextNode('MP'));
            tr.appendChild(td);
            tbl.appendChild(tr);
            return tbl;
        }

        // A control recovered from the raw punch data after a mispunch —
        // real time, but deliberately unranked/uncolored (see
        // buildSplitCells): it may silently include one or more skipped
        // legs, so it isn't a fair leg-for-leg comparison against runners
        // who actually ran that leg.
        function recoveredCell(legMsec, relMsec) {
            var tbl = document.createElement('table');
            tbl.className = 'table-split';
            [legMsec, relMsec].forEach(function (msec) {
                var tr = document.createElement('tr');
                var td = document.createElement('td');
                td.className = 'split-recovered';
                td.title = 'Recovered from the raw punch data after a missing punch — not ranked, may include a skipped leg.';
                td.appendChild(document.createTextNode(toHHMMSS(msec)));
                tr.appendChild(td);
                tbl.appendChild(tr);
            });
            return tbl;
        }

        // Reconstructs one participant's full per-control row, including
        // everything after a mispunch. SportOrg's own course checker
        // freezes at the first missed control — every punch after it fails
        // to match too, even ones that genuinely hit a later control (see
        // ResultSportident.check() in memory.py) — so this second pass
        // matches each remaining raw punch to a control by code alone. A
        // control nobody punched becomes an "MP" cell; a punch recovered
        // this way still shows a real time (measured from the last
        // known-good point, so it silently folds in whatever leg(s) were
        // skipped) but is never ranked/colored and never counted into the
        // "Best time" row — it isn't a fair leg-for-leg comparison.
        // controls: the course's control list (in order). Returns
        // { cells: [{code, kind:'ranked'|'mp'|'recovered', legTime, relTime,
        // legPlace, relPlace}, ...] (length === controls.length),
        // lastRefTime: absolute ms of the last known-good point, official
        // or recovered — used by the caller to compute the finish leg }.
        function buildSplitCells(result, controls) {
            var splits = result.splits || [];
            var official = splits.filter(function (s) { return s.is_correct; });
            var cells = [];
            var i;
            for (i = 0; i < official.length && i < controls.length; i++) {
                cells.push({
                    code: controls[i].code, kind: 'ranked',
                    legTime: official[i].leg_time, relTime: official[i].relative_time,
                    legPlace: official[i].leg_place, relPlace: official[i].relative_place
                });
            }
            var lastRefTime = official.length
                ? result.start_msec + official[official.length - 1].relative_time
                : result.start_msec;
            if (official.length < controls.length) {
                var lastOfficial = official.length ? official[official.length - 1] : null;
                var lastOfficialIdx = lastOfficial ? splits.indexOf(lastOfficial) : -1;
                var tail = splits.slice(lastOfficialIdx + 1);
                var tc = 0;
                for (var ci = official.length; ci < controls.length; ci++) {
                    var code = controls[ci].code;
                    var matchIdx = -1;
                    for (var t = tc; t < tail.length; t++) {
                        if (String(tail[t].code) === String(code)) { matchIdx = t; break; }
                    }
                    if (matchIdx === -1) {
                        cells.push({ code: code, kind: 'mp' });
                    } else {
                        var legTime = tail[matchIdx].time - lastRefTime;
                        var relTime = tail[matchIdx].time - result.start_msec;
                        cells.push({ code: code, kind: 'recovered', legTime: legTime, relTime: relTime });
                        lastRefTime = tail[matchIdx].time;
                        tc = matchIdx + 1;
                    }
                }
            }
            return { cells: cells, lastRefTime: lastRefTime };
        }

        // Turns one buildSplitCells() entry into the actual table cell.
        function splitCellFor(cell) {
            if (cell.kind === 'mp') return mpCell();
            if (cell.kind === 'recovered') return recoveredCell(cell.legTime, cell.relTime);
            var tbl = document.createElement('table');
            tbl.className = 'table-split';
            tbl.appendChild(rankedTrBlock(toHHMMSS(cell.legTime) + ' (' + cell.legPlace + ')', cell.legPlace));
            tbl.appendChild(rankedTrBlock(toHHMMSS(cell.relTime) + ' (' + cell.relPlace + ')', cell.relPlace));
            return tbl;
        }

        // Standard-competition-ranking lookup (ties share a place, next
        // distinct value skips ahead) against an ascending-sorted array —
        // same binary search already used for course-view CP columns,
        // hoisted here so the group-view finish leg can rank against
        // everyone in its group too.
        function rankOf(sortedArr, value) {
            var l = -1, r = sortedArr.length - 1;
            while (r - l > 1) {
                var m = Math.floor((l + r) / 2);
                if (sortedArr[m] >= value) r = m; else l = m;
            }
            if (sortedArr[r] === value) return r + 1;
            return 0;
        }

        // ── SPLIT CHART ──────────────────────────────────────────────────
        //   Same design as urix's Race Results chart: opt-in only (nothing
        //   plotted until checked in the table), up to MAX_HIGHLIGHTED
        //   runners at a time, one stable color slot per bib. X = control
        //   point (in course order) + Finish. Y = gap to whoever led at
        //   that point among the selected runners, inverted so the leader
        //   rides the top of the chart at 0. Clicking a control's axis
        //   label pins a "standings at that point" list below the chart.
        //   State lives outside render() (module scope) so it survives
        //   every full-panel re-render render() does on any interaction.

        var MAX_HIGHLIGHTED = 8;
        var chartState = {}; // key -> { open, highlighted: Map(bib -> color slot 0-7), selectedCp }

        // Short label for a chartable non-finisher, shown on their end-of-line
        // marker so a mispunch/DSQ/DNF line reads as "stopped here", not as a
        // finish. Falls back to a generic tag for any status not listed.
        var CHART_STATUS_LABEL = {
            3: 'DSQ',   // disqualified
            4: 'MP',    // missing punch
            5: 'DNF',   // did not finish
            8: 'OVT',   // overtime
            9: 'WD',    // sporting withdrawal
            17: 'MP'    // missed penalty lap
        };

        function getChartState(key) {
            if (!chartState[key]) chartState[key] = { open: false, highlighted: new Map(), selectedCp: null, autoFilled: false };
            return chartState[key];
        }

        function svgEl(tag, attrs) {
            var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            if (attrs) {
                Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
            }
            return el;
        }

        // Round the axis max up to a "clean" step (in msec) so gridline
        // labels are round numbers, aiming for roughly 4-6 gridlines.
        function niceAxisMaxMsec(maxMsec) {
            var steps = [60000, 120000, 300000, 600000, 900000, 1200000, 1800000, 2700000,
                3600000, 5400000, 7200000, 10800000, 14400000, 21600000];
            for (var i = 0; i < steps.length; i++) {
                if (maxMsec / steps[i] <= 6) return { step: steps[i], max: Math.ceil(maxMsec / steps[i]) * steps[i] };
            }
            var lastStep = 28800000;
            return { step: lastStep, max: Math.ceil(maxMsec / lastStep) * lastStep };
        }

        // Connects every real (non-null) point in order, skipping missing
        // controls entirely rather than breaking or guessing a value.
        function buildPathD(points, xOf, yOf) {
            var d = '', first = true;
            points.forEach(function (v, i) {
                if (v == null) return;
                d += (first ? 'M' : ' L') + xOf(i).toFixed(1) + ',' + yOf(v).toFixed(1);
                first = false;
            });
            return d;
        }

        // Gap-to-leader label: 0 reads as "Leader", otherwise a signed +hh:mm:ss.
        function fmtGapMsec(msec) {
            if (msec == null) return '—';
            return msec <= 0 ? 'Leader' : '+' + toHHMMSS(msec);
        }

        function buildChartCheckbox(key, bib) {
            var state = getChartState(key);
            var slot = state.highlighted.get(bib); // number (0-7) if checked, undefined otherwise

            var wrap = document.createElement('span');
            wrap.className = 'split-chart-check-wrap';

            var input = document.createElement('input');
            input.type = 'checkbox';
            input.className = 'split-chart-check';
            input.dataset.key = key;
            input.dataset.bib = bib;
            input.checked = slot !== undefined;
            if (!input.checked && state.highlighted.size >= MAX_HIGHLIGHTED) input.disabled = true;
            wrap.appendChild(input);

            // Same color as this runner's line on the chart, so their row
            // is identifiable without having the chart panel open.
            if (slot !== undefined) {
                var pin = document.createElement('span');
                pin.className = 'split-chart-check-pin';
                pin.setAttribute('style', 'background-color: var(--series-' + (slot + 1) + ')');
                wrap.appendChild(pin);
            }

            return wrap;
        }

        function buildChartStandings(key, series, columns, selectedCp) {
            if (!selectedCp) return null;
            var idx = columns.indexOf(selectedCp);
            if (idx < 0) return null;
            var state = getChartState(key);

            var withTime = [], noData = [];
            series.forEach(function (s) {
                var gap = s.gaps[idx];
                (gap == null ? noData : withTime).push({ bib: s.bib, name: s.name, gap: gap });
            });
            withTime.sort(function (a, b) { return a.gap - b.gap; });

            var box = document.createElement('div');
            box.className = 'split-chart-standings';
            var title = document.createElement('div');
            title.className = 'split-chart-standings-title';
            title.textContent = 'Standings at ' + selectedCp;
            box.appendChild(title);

            var list = document.createElement('ol');
            list.className = 'split-chart-standings-list';
            withTime.forEach(function (s, i) {
                var li = document.createElement('li');

                var rank = document.createElement('span');
                rank.className = 'split-chart-standing-rank';
                rank.textContent = String(i + 1);
                li.appendChild(rank);

                var slot = state.highlighted.get(s.bib);
                if (slot != null) {
